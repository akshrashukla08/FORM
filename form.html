<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>SIGN UP PAGE</h1>
    <HR>
    <FORM action="">
        <P>ENTER FULL NAME</P>
        <input type="text" placeholder="YOUR NAME" required><br>
        <P>ENTER PHONE</P>
        <input type="number" placeholder="0123456789" required><br>
        <p>ENTER YOUR E-MAIL</p>
        <input type="email" placeholder="name@gmail.com"><br>
        <p>CHOOSE YOUR COURSE</p>
        <select required>
            <option>CSE</option>
            <option>AIML</option>
            <option>IOT</option>
            <option>CS</option><br>
        </select>
            <P>SELECT YOUR GENDER</P>
            <input name="a" type="radio">
            <label>MALE</label>
            <input name="a" type="radio">
            <label>FEMALE</label>
            <input name="a" type="radio">
            <label>OTHER</label><br><br>

            <label>UPLOAD RESUME</label>
            <input type="file"><br><br>
            <label>FEEDBACK</label><br>
            <textarea placeholder="YOUR FEEDBACK"></textarea><br><br>
            <label>PRICE RANGE</label>
            <input min="1" max="10" type="range"><br><br>
            <label>DATE OF BIRTH</label>
            <input type="date"><br><br>
            <input type="checkbox">
            <label>TERMS AND CONDITIONS</label>
            <br><br>
            <button>SUBMIT</button>
                
    </FORM>
</body>
</html>
